<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Non-Overlapping Popup Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Controls bar */
    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 14px;
      padding: 12px 20px;
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    #controls button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.1s;
    }
    #controls button:active { transform: scale(0.95); }

    #btn-spawn {
      background: #6366f1;
      color: #fff;
    }
    #btn-spawn:hover { background: #818cf8; }

    #btn-spawn-many {
      background: #0ea5e9;
      color: #fff;
    }
    #btn-spawn-many:hover { background: #38bdf8; }

    #btn-clear {
      background: #ef4444;
      color: #fff;
    }
    #btn-clear:hover { background: #f87171; }

    #count-label {
      font-size: 13px;
      color: #94a3b8;
      min-width: 60px;
      text-align: center;
    }

    /* Hint */
    #hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #64748b;
      pointer-events: none;
      z-index: 9999;
    }

    /* Popup */
    .popup {
      position: absolute;
      width: 200px;
      background: rgba(30, 41, 59, 0.95);
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.5);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      cursor: grab;
      transition: box-shadow 0.2s;
      will-change: transform;
      /* position is managed via left/top */
    }
    .popup:hover {
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
    }
    .popup.dragging {
      cursor: grabbing;
      box-shadow: 0 16px 48px rgba(99, 102, 241, 0.5);
      z-index: 1000 !important;
    }
    .popup.overlap-flash {
      border-color: rgba(239, 68, 68, 0.8);
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 8px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.2);
    }

    .popup-title {
      font-size: 13px;
      font-weight: 700;
      color: #818cf8;
    }

    .popup-close {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ef4444;
      border: none;
      cursor: pointer;
      font-size: 10px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .popup-close:hover { background: #f87171; }

    .popup-body {
      padding: 10px 12px 12px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .popup-body .tag {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border-radius: 4px;
      padding: 2px 6px;
      margin: 2px;
      font-size: 11px;
    }

    /* Spawn animation */
    @keyframes popIn {
      0%   { transform: scale(0.3); opacity: 0; }
      70%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .popup.spawn-anim {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body>

<div id="stage"></div>

<div id="hint">クリックでPopupを追加 / ドラッグで移動</div>

<div id="controls">
  <button id="btn-spawn">+ Popup追加</button>
  <button id="btn-spawn-many">×5 まとめて追加</button>
  <button id="btn-clear">全削除</button>
  <span id="count-label">0 個</span>
</div>

<script>
const stage = document.getElementById('stage');
const countLabel = document.getElementById('count-label');

// --- Popup data store ---
let popups = [];     // { id, el, x, y, w, h, vx, vy }
let nextId = 1;
let animFrameId = null;

const PADDING = 8;      // gap to maintain between popups
const DAMPING = 0.6;    // velocity damping per frame
const PUSH_STRENGTH = 0.5; // force multiplier
const MAX_V = 18;       // max velocity per frame
const SETTLE_V = 0.3;   // below this, stop animating

// Popup content templates
const templates = [
  { title: '通知', body: '<p>新しいメッセージが届いています。</p>', tags: ['info'] },
  { title: 'アラート', body: '<p>サーバーへの接続に失敗しました。</p>', tags: ['error', 'network'] },
  { title: '完了', body: '<p>ファイルのアップロードが完了しました。</p>', tags: ['success'] },
  { title: 'ヒント', body: '<p>ドラッグして好きな位置に移動できます。</p>', tags: ['tip'] },
  { title: 'ダウンロード', body: '<p>data_export.csv の準備ができました。</p>', tags: ['file'] },
  { title: 'バージョン情報', body: '<p>v2.4.1 が利用可能です。今すぐ更新しますか？</p>', tags: ['update'] },
  { title: 'エラー', body: '<p>入力値が不正です。再度確認してください。</p>', tags: ['error'] },
  { title: 'リマインダー', body: '<p>ミーティングまであと5分です。</p>', tags: ['calendar'] },
];

function randomTemplate() {
  return templates[Math.floor(Math.random() * templates.length)];
}

// --- Create popup at (cx, cy) ---
function spawnPopup(cx, cy) {
  const tpl = randomTemplate();
  const id = nextId++;

  const el = document.createElement('div');
  el.className = 'popup spawn-anim';
  el.style.zIndex = id;

  el.innerHTML = `
    <div class="popup-header">
      <span class="popup-title">${tpl.title} #${id}</span>
      <button class="popup-close" data-id="${id}">✕</button>
    </div>
    <div class="popup-body">
      ${tpl.body}
      <div>${tpl.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `;

  stage.appendChild(el);

  // Measure after append
  const w = el.offsetWidth;
  const h = el.offsetHeight;

  // Center popup on click point, clamped to viewport
  const stageW = stage.clientWidth;
  const stageH = stage.clientHeight;
  const x = Math.min(Math.max(cx - w / 2, 0), stageW - w);
  const y = Math.min(Math.max(cy - h / 2, 0), stageH - h);

  const data = { id, el, x, y, w, h, vx: 0, vy: 0, pinned: false };
  popups.push(data);

  applyPos(data);
  bindDrag(el, data);

  el.querySelector('.popup-close').addEventListener('click', (e) => {
    e.stopPropagation();
    removePopup(id);
  });

  // Remove spawn animation class after it ends
  el.addEventListener('animationend', () => el.classList.remove('spawn-anim'));

  updateCount();
  startLoop();
}

function removePopup(id) {
  const idx = popups.findIndex(p => p.id === id);
  if (idx === -1) return;
  const p = popups[idx];
  p.el.remove();
  popups.splice(idx, 1);
  updateCount();
}

function clearAll() {
  popups.forEach(p => p.el.remove());
  popups = [];
  updateCount();
}

function updateCount() {
  countLabel.textContent = `${popups.length} 個`;
}

function applyPos(p) {
  p.el.style.left = p.x + 'px';
  p.el.style.top  = p.y + 'px';
}

// --- Physics loop ---
function startLoop() {
  if (animFrameId) return;
  animFrameId = requestAnimationFrame(tick);
}

function tick() {
  const stageW = stage.clientWidth;
  const stageH = stage.clientHeight;

  let anyMoving = false;

  // Resolve overlaps: push pairs apart
  for (let i = 0; i < popups.length; i++) {
    for (let j = i + 1; j < popups.length; j++) {
      const a = popups[i];
      const b = popups[j];
      if (a.pinned && b.pinned) continue;

      // AABB overlap check with padding
      const gap = PADDING;
      const ax1 = a.x - gap, ax2 = a.x + a.w + gap;
      const ay1 = a.y - gap, ay2 = a.y + a.h + gap;
      const bx1 = b.x,       bx2 = b.x + b.w;
      const by1 = b.y,       by2 = b.y + b.h;

      const overlapX = Math.min(ax2, bx2) - Math.max(ax1, bx1);
      const overlapY = Math.min(ay2, by2) - Math.max(ay1, by1);

      if (overlapX <= 0 || overlapY <= 0) continue;

      // Push along axis of minimum penetration
      let fx = 0, fy = 0;
      if (overlapX < overlapY) {
        fx = (a.x + a.w / 2 < b.x + b.w / 2) ? -overlapX : overlapX;
      } else {
        fy = (a.y + a.h / 2 < b.y + b.h / 2) ? -overlapY : overlapY;
      }

      const force = PUSH_STRENGTH;
      if (!a.pinned) { a.vx -= fx * force; a.vy -= fy * force; }
      if (!b.pinned) { b.vx += fx * force; b.vy += fy * force; }
    }
  }

  // Integrate positions, dampen, clamp
  for (const p of popups) {
    if (p.pinned) continue;

    p.vx = Math.max(-MAX_V, Math.min(MAX_V, p.vx)) * DAMPING;
    p.vy = Math.max(-MAX_V, Math.min(MAX_V, p.vy)) * DAMPING;

    if (Math.abs(p.vx) < 0.01) p.vx = 0;
    if (Math.abs(p.vy) < 0.01) p.vy = 0;

    p.x += p.vx;
    p.y += p.vy;

    // Keep within stage
    if (p.x < 0) { p.x = 0; p.vx *= -0.3; }
    if (p.y < 0) { p.y = 0; p.vy *= -0.3; }
    if (p.x + p.w > stageW) { p.x = stageW - p.w; p.vx *= -0.3; }
    if (p.y + p.h > stageH) { p.y = stageH - p.h; p.vy *= -0.3; }

    applyPos(p);

    if (Math.abs(p.vx) > SETTLE_V || Math.abs(p.vy) > SETTLE_V) {
      anyMoving = true;
    }
  }

  if (anyMoving) {
    animFrameId = requestAnimationFrame(tick);
  } else {
    animFrameId = null;
  }
}

// --- Drag ---
function bindDrag(el, data) {
  let startMX, startMY, startX, startY;

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onTouchStart, { passive: false });

  function onDown(e) {
    if (e.target.classList.contains('popup-close')) return;
    e.preventDefault();
    startDrag(e.clientX, e.clientY);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  function onTouchStart(e) {
    if (e.target.classList.contains('popup-close')) return;
    e.preventDefault();
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('touchend', onTouchEnd);
  }

  function startDrag(mx, my) {
    startMX = mx;
    startMY = my;
    startX = data.x;
    startY = data.y;
    data.pinned = true;
    data.vx = 0;
    data.vy = 0;
    el.classList.add('dragging');
    // Bring to front
    el.style.zIndex = 2000;
  }

  function onMove(e) { move(e.clientX, e.clientY); }
  function onTouchMove(e) { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }

  function move(mx, my) {
    const stageRect = stage.getBoundingClientRect();
    const dx = mx - startMX;
    const dy = my - startMY;
    data.x = Math.min(Math.max(startX + dx, 0), stage.clientWidth  - data.w);
    data.y = Math.min(Math.max(startY + dy, 0), stage.clientHeight - data.h);
    applyPos(data);
    startLoop();
  }

  function onUp() {
    endDrag();
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  }
  function onTouchEnd() {
    endDrag();
    window.removeEventListener('touchmove', onTouchMove);
    window.removeEventListener('touchend', onTouchEnd);
  }

  function endDrag() {
    data.pinned = false;
    el.classList.remove('dragging');
    el.style.zIndex = data.id;
    startLoop();
  }
}

// --- Controls ---
document.getElementById('btn-spawn').addEventListener('click', () => {
  const x = 80 + Math.random() * (stage.clientWidth  - 260);
  const y = 80 + Math.random() * (stage.clientHeight - 200);
  spawnPopup(x, y);
});

document.getElementById('btn-spawn-many').addEventListener('click', () => {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      // Cluster them near center to make collisions visible
      const cx = stage.clientWidth  / 2 + (Math.random() - 0.5) * 80;
      const cy = stage.clientHeight / 2 + (Math.random() - 0.5) * 80;
      spawnPopup(cx, cy);
    }, i * 60);
  }
});

document.getElementById('btn-clear').addEventListener('click', clearAll);

// Click on stage to spawn
stage.addEventListener('click', (e) => {
  if (e.target !== stage) return;
  spawnPopup(e.clientX, e.clientY);
});
</script>
</body>
</html>

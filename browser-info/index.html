    <meta name="keywords" content="画面サイズ確認, UserAgent, ブラウザ情報, 環境チェック">
    <meta property="og:title" content="ブラウザ環境チェッカー - 画面サイズ・UserAgent">
    <meta property="og:description" content="画面サイズ、UserAgentなどのブラウザ情報を即座に確認。">
    <meta property="og:type" content="website">

<body class="bg-slate-100 min-h-screen">

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="max-w-2xl mx-auto px-4 py-10">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800">💻 ブラウザ環境チェッカー</h1>
        <p class="text-slate-500 mt-2 text-sm">あなたの画面サイズ・UserAgent・ブラウザ情報をまとめて確認</p>
    </div>

    <!-- Browser / Screen Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
        <h2 class="text-base font-semibold text-slate-700 mb-4 flex items-center gap-2">
            <span>🖥️</span> ブラウザ / 画面情報
        </h2>
        <div id="browser-section"></div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
        <a href="/" class="hover:underline">← ホームに戻る</a>
    </p>
</div>

<script>
function row(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return `
        <div class="flex flex-col sm:flex-row sm:items-start py-2 border-b border-slate-100 last:border-0 gap-0.5 sm:gap-3">
            <div class="text-xs font-medium text-slate-400 sm:w-36 shrink-0 pt-0.5">${label}</div>
            <div class="text-sm text-slate-800 break-all">${value}</div>
        </div>`;
}

const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

function formatBytes(n){ return n==null? '不明': n; }

function buildItems() {
    return [
        ['スクリーン解像度',      `${screen.width} × ${screen.height} px`],
        ['ビューポートサイズ',    `${window.innerWidth} × ${window.innerHeight} px`],
        ['デバイスピクセル比',    `${window.devicePixelRatio}x`],
        ['カラー深度',            `${screen.colorDepth} bit`],
        ['ブラウザ言語',          navigator.language],
        ['タイムゾーン',          Intl.DateTimeFormat().resolvedOptions().timeZone],
        ['OS / プラットフォーム', navigator.platform || '不明'],
        ['CPUコア数',             navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} コア` : '不明'],
        ['デバイスメモリ',        navigator.deviceMemory ? `${navigator.deviceMemory} GB` : '不明'],
        ['通信種別',              conn ? (conn.effectiveType || conn.type || '不明') : '不明'],
        ['Cookie',                navigator.cookieEnabled ? '有効' : '無効'],
        ['User Agent',            `<span class="break-all">${navigator.userAgent}</span>`],
    ];
}

function measureUrlBar() {
    const inner = window.innerHeight;
    const visual = (window.visualViewport && window.visualViewport.height) || inner;
    const docClient = document.documentElement.clientHeight;
    const outer = window.outerHeight || window.screen.height || 0;

    // Several heuristic estimates — different browsers expose different metrics.
    const estOuterMinusInner = Math.max(0, outer - inner);
    const estInnerMinusVisual = Math.max(0, inner - visual);
    const estDocClientMinusVisual = Math.max(0, docClient - visual);

    return {
        inner,
        visual,
        docClient,
        outer,
        estOuterMinusInner,
        estInnerMinusVisual,
        estDocClientMinusVisual
    };
}

function prettyUrlBarText(m) {
    return `outer-inner: ${m.estOuterMinusInner}px, inner-visual: ${m.estInnerMinusVisual}px, docClient-visual: ${m.estDocClientMinusVisual}px`;
}

function updateInfo(){
    const items = buildItems();
    const m = measureUrlBar();
    items.splice(2, 0, ['URLバー高さ (推定)', prettyUrlBarText(m)]);
    document.getElementById('browser-section').innerHTML = items.map(([k, v]) => row(k, v)).join('');
}

updateInfo();
window.addEventListener('resize', updateInfo);
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateInfo);
    window.visualViewport.addEventListener('scroll', updateInfo);
}
</script>
</body>

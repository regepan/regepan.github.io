<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Buttons Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KLDMTKJQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<h1 class="mb-5">Bootstrap Buttons Demo</h1>

<!-- Basic Colors -->
<section class="mb-5">
    <h2 class="h4 mb-3">Basic Colors</h2>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-danger">Danger</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-info">Info</button>
        <button type="button" class="btn btn-light">Light</button>
        <button type="button" class="btn btn-dark">Dark</button>
        <button type="button" class="btn btn-link">Link</button>
    </div>
</section>

<!-- Outline -->
<section class="mb-5">
    <h2 class="h4 mb-3">Outline</h2>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-primary">Primary</button>
        <button type="button" class="btn btn-outline-secondary">Secondary</button>
        <button type="button" class="btn btn-outline-success">Success</button>
        <button type="button" class="btn btn-outline-danger">Danger</button>
        <button type="button" class="btn btn-outline-warning">Warning</button>
        <button type="button" class="btn btn-outline-info">Info</button>
        <button type="button" class="btn btn-outline-light">Light</button>
        <button type="button" class="btn btn-outline-dark">Dark</button>
    </div>
</section>

<!-- Sizes -->
<section class="mb-5">
    <h2 class="h4 mb-3">Sizes</h2>
    <div class="d-flex flex-wrap align-items-center gap-2">
        <button type="button" class="btn btn-primary btn-lg">Large</button>
        <button type="button" class="btn btn-primary">Default</button>
        <button type="button" class="btn btn-primary btn-sm">Small</button>
    </div>
</section>

<!-- Disabled -->
<section class="mb-5">
    <h2 class="h4 mb-3">Disabled</h2>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary" disabled>Primary</button>
        <button type="button" class="btn btn-secondary" disabled>Secondary</button>
        <button type="button" class="btn btn-outline-primary" disabled>Outline Primary</button>
    </div>
</section>

<!-- Block (Full Width) -->
<section class="mb-5">
    <h2 class="h4 mb-3">Block (Full Width)</h2>
    <div class="d-grid gap-2">
        <button type="button" class="btn btn-primary">Block Primary</button>
        <button type="button" class="btn btn-secondary">Block Secondary</button>
    </div>
</section>

<!-- Toggle (Active State) -->
<section class="mb-5">
    <h2 class="h4 mb-3">Toggle (Active State)</h2>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary active" aria-pressed="true">Active</button>
        <button type="button" class="btn btn-primary">Normal</button>
        <button type="button" class="btn btn-primary" disabled>Disabled</button>
    </div>
</section>

<!-- Button Group -->
<section class="mb-5">
    <h2 class="h4 mb-3">Button Group</h2>
    <div class="btn-group mb-2" role="group">
        <button type="button" class="btn btn-primary">Left</button>
        <button type="button" class="btn btn-primary">Middle</button>
        <button type="button" class="btn btn-primary">Right</button>
    </div>
    <br>
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-secondary">1</button>
        <button type="button" class="btn btn-outline-secondary">2</button>
        <button type="button" class="btn btn-outline-secondary">3</button>
        <button type="button" class="btn btn-outline-secondary">4</button>
    </div>
</section>

<a href="../" class="btn btn-outline-secondary btn-sm">← Back</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

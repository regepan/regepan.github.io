<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Rain — WebGL Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 20px 24px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; color: #fff; font-family: monospace;
        }
        #ui a { pointer-events: all; color: #556; text-decoration: none; font-size: 13px; }
        #ui a:hover { color: #99a; }
        h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .sub { font-size: 11px; color: #556; line-height: 1.8; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
    <div><a href="../">← Rain &amp; Clouds</a></div>
    <div style="text-align:right">
        <h2>Heavy Rain</h2>
        <div class="sub">都市シルエット · 雷 · 水面反射<br>Fragment Shader · hash noise</div>
    </div>
</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;

const fs = `
precision highp float;
uniform float u_t;
uniform vec2 u_r;

float h1(float n){ return fract(sin(n)*43758.5453); }
float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

float bldH(float x){ return h1(floor(x*16.0)*0.37+1.7)*0.25+0.10; }
float inBld(vec2 uv){
    float gY=0.22;
    return step(gY,uv.y)*step(uv.y,gY+bldH(uv.x));
}
float winLight(vec2 uv){
    vec2 wc=floor(uv*vec2(40.,16.));
    float on=step(0.55,h2(wc));
    vec2 wuv=fract(uv*vec2(40.,16.));
    return step(0.15,wuv.x)*step(wuv.x,0.85)*step(0.12,wuv.y)*step(wuv.y,0.88)*on;
}
float rain(vec2 uv,float xs,float ys,float spd,float wind){
    vec2 ruv=uv*vec2(xs,ys);
    ruv.x+=uv.y*wind;
    vec2 cell=floor(ruv);
    vec2 loc=fract(ruv);
    float hv=h2(cell);
    float xp=0.1+hv*0.8;
    float yp=fract(u_t*spd+h2(cell+5.3));
    float dx=abs(loc.x-xp);
    float dy=loc.y-(1.0-yp);
    return smoothstep(0.016,0.,dx)*smoothstep(0.20,0.,max(dy,0.))*step(0.,dy)*(0.4+0.6*hv);
}
float boltLine(vec2 uv,float lx,float seed){
    float x=uv.x-lx;
    x-=sin(uv.y*18.0+seed)*0.025;
    x-=sin(uv.y*42.0+seed*2.1)*0.008;
    x-=sin(uv.y*80.0+seed*3.7)*0.004;
    return smoothstep(0.004,0.,abs(x))*step(0.22,uv.y)*step(uv.y,0.90);
}

void main(){
    vec2 uv=gl_FragCoord.xy/u_r;

    // Lightning timing
    float lt=mod(u_t*0.55,13.0);
    float flash=0.0,boltV=0.0;
    if(lt<0.09){ flash=(0.09-lt)/0.09*0.80; boltV=boltLine(uv,0.33,1.5)*flash*4.0; }
    if(lt>7.0&&lt<7.12){ float f2=1.0-(lt-7.0)/0.12; flash+=f2*0.50; boltV+=boltLine(uv,0.68,3.8)*f2*3.5; }

    // Sky gradient
    vec3 col=mix(vec3(0.005,0.005,0.025),vec3(0.04,0.06,0.12),uv.y);
    col+=flash*vec3(0.55,0.65,1.0)*(0.5+0.5*uv.y);

    float gY=0.22;
    float ib=inBld(uv);
    float ig=step(uv.y,gY);

    // Building
    if(ib>0.5){
        vec3 bc=vec3(0.012,0.012,0.020);
        bc+=winLight(uv)*vec3(0.62,0.52,0.28);
        bc+=flash*0.15*vec3(0.7,0.8,1.0);
        col=bc;
    }
    // Ground
    if(ig>0.5){
        vec3 gc=vec3(0.010,0.012,0.018);
        // Reflection
        vec2 rUV=vec2(uv.x,gY*2.0-uv.y);
        float rb=inBld(rUV);
        if(rb>0.5){ gc=mix(gc,vec3(0.020,0.020,0.032),0.7); gc+=winLight(rUV)*vec3(0.12,0.10,0.06); }
        else { gc+=mix(vec3(0.005,0.005,0.025),vec3(0.04,0.06,0.12),rUV.y)*0.08; }
        // Ripple shimmer
        float rip=sin(uv.x*88.0+u_t*4.2)*sin(uv.x*62.0-u_t*3.1)*0.010*step(uv.y,gY-0.05);
        gc+=rip*vec3(0.25,0.45,0.90);
        gc+=flash*vec3(0.07,0.09,0.17);
        col=gc;
    }

    // Rain layers
    float r=0.0;
    r+=rain(uv,95.,35.,1.35,-0.18);
    r+=rain(uv,60.,22.,1.05,-0.14)*0.65;
    r+=rain(uv,38.,14.,0.78,-0.10)*0.45;
    r=clamp(r,0.,1.);
    float ro_=ib>0.5?0.25:(ig>0.5?0.50:1.0);
    col+=r*vec3(0.48,0.60,0.90)*ro_;

    // Lightning bolt
    col+=boltV*vec3(0.92,0.95,1.0)*(1.0-ig*0.6);

    // Vignette
    vec2 vc=uv*2.0-1.0;
    col*=1.0-dot(vc,vc)*0.30;

    gl_FragColor=vec4(col,1.0);
}`;

function mk(t,s){ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh)); return sh; }
const prog=gl.createProgram();
gl.attachShader(prog,mk(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog); gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aloc=gl.getAttribLocation(prog,'a');
gl.enableVertexAttribArray(aloc); gl.vertexAttribPointer(aloc,2,gl.FLOAT,false,0,0);
const uT=gl.getUniformLocation(prog,'u_t'), uR=gl.getUniformLocation(prog,'u_r');
function draw(t){ gl.uniform1f(uT,t/1000); gl.uniform2f(uR,canvas.width,canvas.height); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); requestAnimationFrame(draw); }
requestAnimationFrame(draw);
</script>
</body>
</html>

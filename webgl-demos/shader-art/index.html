    <title>Shader Art - WebGL Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: fixed;
            top: 0; left: 0; right: 0;

        #ui a:hover { color: #aaa; }

            position: fixed;

            color: #2a4a2a;

            pointer-events: none;

        }

            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid #333;

            color: #888;
            font-family: monospace;
            font-size: 12px;
            padding: 6px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #mode-btn:hover { background: #1a1a1a; color: #ccc; border-color: #555; }

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KLDMTKJQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<canvas id="c"></canvas>
<div id="ui">
    <div>
        <h2>Shader Art</h2>
        <div class="sub">フラグメントシェーダーだけで生成</div>
        <div class="sub" id="mode-label">mode: plasma waves</div>
    </div>
    <a href="../">← Back</a>
</div>
<div id="code">
    各ピクセルの色を GLSL で計算<br>
    CPU 処理ゼロ · 純粋な数式のみ<br>
    uniform float u_time で時間入力
</div>
<div id="fps"></div>
<button id="mode-btn">Switch Pattern →</button>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px">WebGL not supported</p>'; }

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// --- Fullscreen quad ---
const quadVS = `
attribute vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const qBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

// --- Shader modes ---
const modes = [
    {
        name: 'plasma waves',
        fs: `
precision highp float;
uniform float u_time;
uniform vec2  u_res;
uniform vec2  u_mouse;

void main() {
    vec2 uv = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
    uv.x *= u_res.x / u_res.y;
    float t = u_time * 0.5;

    // Four orbiting wave sources
    vec2 s0 = vec2(cos(t * 0.7),         sin(t * 0.5))         * 0.55;
    vec2 s1 = vec2(sin(t * 0.4 + 1.2),   cos(t * 0.9 + 0.8))   * 0.50;
    vec2 s2 = vec2(cos(t * 1.1 + 2.5),   sin(t * 0.6 + 1.8))   * 0.45;
    vec2 s3 = vec2(sin(t * 0.8 + 3.7),   cos(t * 1.4 + 2.3))   * 0.40;

    float v = 0.0;
    v += sin(length(uv - s0) * 9.0 - t * 3.0);
    v += sin(length(uv - s1) * 7.0 - t * 2.2);
    v += sin(length(uv - s2) * 11.0 - t * 4.0);
    v += sin(length(uv - s3) * 6.0  - t * 1.5);
    v += sin((uv.x + uv.y) * 3.5 + t * 1.2);
    v = v / 5.0 * 0.5 + 0.5;

    // HSL-like color cycling
    float r = sin(v * 6.283 * 1.5 + t * 0.8)       * 0.5 + 0.5;
    float g = sin(v * 6.283 * 1.5 + t * 0.8 + 2.09) * 0.5 + 0.5;
    float b = sin(v * 6.283 * 1.5 + t * 0.8 + 4.19) * 0.5 + 0.5;

    gl_FragColor = vec4(r, g, b, 1.0);
}`
    },
    {
        name: 'domain warping',
        fs: `
precision highp float;
uniform float u_time;
uniform vec2  u_res;
uniform vec2  u_mouse;

vec2 warp(vec2 p, float t) {
    return vec2(
        p.x + sin(p.y * 2.5 + t * 0.8) * 0.4 + cos(p.x * 1.8 + t * 0.5) * 0.25,
        p.y + cos(p.x * 2.0 + t * 0.6) * 0.4 + sin(p.y * 1.5 + t * 0.7) * 0.25
    );
}

float field(vec2 p) {
    return sin(p.x * 3.0) * cos(p.y * 2.5) + sin(length(p) * 5.0);
}

void main() {
    vec2 uv = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
    uv.x *= u_res.x / u_res.y;
    float t = u_time * 0.4;

    // Two levels of domain warping
    vec2 p1 = warp(uv, t);
    vec2 p2 = warp(p1, t * 1.3 + 1.0);

    float f = field(p2) * 0.5 + 0.5;

    // Deep neon color
    vec3 col;
    col.r = pow(abs(sin(f * 3.14159 * 2.0 + t)), 0.4);
    col.g = pow(abs(sin(f * 3.14159 * 2.0 + t + 2.09)), 0.5);
    col.b = pow(abs(sin(f * 3.14159 * 2.0 + t + 4.19)), 0.35);
    col = clamp(col * 1.2, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
}`
    },
    {
        name: 'hypnotic tunnel',
        fs: `
precision highp float;
uniform float u_time;
uniform vec2  u_res;
uniform vec2  u_mouse;

void main() {
    vec2 uv = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
    uv.x *= u_res.x / u_res.y;
    float t = u_time * 0.6;

    // Polar coords
    float r   = length(uv);
    float phi = atan(uv.y, uv.x);

    // Tunnel: warp angle and radius
    float a = phi / (3.14159 * 2.0) + 0.5;
    float d = 0.3 / r;                        // depth into tunnel
    float stripe = fract(d - t);             // scrolling bands

    float wave = sin(a * 12.0 + t * 2.5 + d * 8.0) * 0.5 + 0.5;
    float edge  = smoothstep(0.45, 0.55, stripe);

    float v = wave * (1.0 - edge) + edge;
    v = clamp(v, 0.0, 1.0);

    vec3 col;
    col.r = sin(v * 6.28 * 2.0 + t)         * 0.5 + 0.5;
    col.g = sin(v * 6.28 * 2.0 + t + 2.09)  * 0.5 + 0.5;
    col.b = sin(v * 6.28 * 2.0 + t + 4.19)  * 0.5 + 0.5;

    // Vignette
    col *= 1.0 - smoothstep(0.6, 1.4, r);

    gl_FragColor = vec4(col, 1.0);
}`
    }
];

// --- Compile program for a given fragment shader ---
function buildProg(fsSource) {
    function makeShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            console.error('Shader error:', gl.getShaderInfoLog(s));
        }
        return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, makeShader(gl.VERTEX_SHADER, quadVS));
    gl.attachShader(p, makeShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(p);
    return p;
}

// Pre-compile all programs
const progs = modes.map(m => buildProg(m.fs));

let currentMode = 0;
let prog = progs[currentMode];
let startT = null;
let frames = 0, fpsT = 0;
let mx = 0.5, my = 0.5;

canvas.addEventListener('mousemove', e => {
    mx = e.clientX / canvas.width;
    my = 1.0 - e.clientY / canvas.height;
});

document.getElementById('mode-btn').addEventListener('click', () => {
    currentMode = (currentMode + 1) % modes.length;
    prog = progs[currentMode];
    document.getElementById('mode-label').textContent = 'mode: ' + modes[currentMode].name;
    startT = null; // reset time
});

function frame(t) {
    if (startT === null) startT = t;
    const elapsed = (t - startT) / 1000;

    frames++;
    if (t - fpsT > 700) {
        document.getElementById('fps').textContent =
            Math.round(frames / ((t - fpsT) / 1000)) + ' FPS';
        frames = 0; fpsT = t;
    }

    gl.useProgram(prog);

    // Bind quad
    gl.bindBuffer(gl.ARRAY_BUFFER, qBuf);
    const posLoc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    // Set uniforms
    gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), elapsed);
    gl.uniform2f(gl.getUniformLocation(prog, 'u_res'),  canvas.width, canvas.height);
    gl.uniform2f(gl.getUniformLocation(prog, 'u_mouse'), mx, my);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>

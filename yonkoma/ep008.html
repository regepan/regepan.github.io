<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第8話「買い物リスト」 - 4コマ漫画</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #333;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.85rem;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      flex: 1;
      letter-spacing: 0.05em;
    }

    .strip-wrap {
      width: 100%;
      max-width: 420px;
      padding: 16px 0 24px;
    }

    .manga-title {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: #333;
      padding: 6px 16px;
      margin: 0 12px 0;
      border-radius: 6px 6px 0 0;
      display: block;
    }

    .strip {
      border: 3px solid #333;
      background: #fff;
      margin: 0 12px;
    }

    .panel {
      border-bottom: 3px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
      min-height: 200px;
      position: relative;
      gap: 10px;
    }

    .panel:last-child {
      border-bottom: none;
    }

    .panel-num {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 0.7rem;
      color: #bbb;
      font-weight: bold;
    }

    .art {
      font-size: 3.8rem;
      line-height: 1.3;
      text-align: center;
    }

    .speech {
      background: #fff;
      border: 2px solid #333;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
      width: 100%;
      position: relative;
    }

    .speech::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top: 9px solid #333;
    }

    .speech.top::after { display: none; }
    .speech.top::before {
      content: '';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-bottom: 9px solid #333;
    }

    .narration {
      background: #fffde7;
      border: 1px solid #bbb;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
      width: 100%;
      border-radius: 4px;
    }

    .effect {
      font-size: 1.4rem;
      font-weight: bold;
      color: #e53935;
      text-align: center;
      letter-spacing: 0.05em;
    }

    nav {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      padding: 16px 12px 32px;
      gap: 10px;
    }

    nav a {
      flex: 1;
      display: block;
      text-align: center;
      background: #333;
      color: #fff;
      text-decoration: none;
      padding: 14px 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    nav a.disabled {
      background: #ccc;
      pointer-events: none;
    }

    nav a.index {
      background: #666;
      flex: 0.6;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html">← 一覧</a>
  <h1>4コマ漫画</h1>
  <span style="width:3rem"></span>
</header>

<div class="strip-wrap">
  <span class="manga-title">第8話「買い物リスト」</span>
  <div class="strip">

    <div class="panel">
      <span class="panel-num">1</span>
      <div class="narration">スーパー到着</div>
      <div class="art">🛒😊</div>
      <div class="speech">リスト通りに<br>完璧に買うぞ！</div>
    </div>

    <div class="panel">
      <span class="panel-num">2</span>
      <div class="art">📱😱</div>
      <div class="effect">ガーン</div>
      <div class="speech">あれ…<br>リスト、家に忘れた</div>
    </div>

    <div class="panel">
      <span class="panel-num">3</span>
      <div class="art">🛒🤔</div>
      <div class="speech">大丈夫！だいたい<br>覚えてる！<br>えーと…卵、牛乳…</div>
    </div>

    <div class="panel">
      <span class="panel-num">4</span>
      <div class="art">🏠🥚🥛</div>
      <div class="speech">卵と牛乳しか<br>買ってなかった</div>
      <div class="narration">全然覚えてなかった</div>
    </div>

  </div>
</div>

<nav>
  <a href="ep007.html">← 前の話</a>
  <a href="index.html" class="index">一覧</a>
  <a href="ep009.html">次の話 →</a>
</nav>

</body>
</html>

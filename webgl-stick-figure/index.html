<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGL 棒人間アニメーション</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #080810;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    min-height: 100vh;
}
header {
    padding: 32px 40px;
    border-bottom: 1px solid #1a1a2e;
}
header a {
    color: #555;
    text-decoration: none;
    font-size: 13px;
}
header a:hover { color: #aaa; }
h1 {
    margin-top: 14px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
}
.subtitle {
    margin-top: 6px;
    color: #555;
    font-size: 13px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 40px;
    max-width: 1000px;
}
.card {
    background: #0e0e1a;
    border: 1px solid #1e1e32;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s;
    display: block;
}
.card:hover {
    border-color: #4040a0;
    transform: translateY(-2px);
}
.card-preview {
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
}
.demo1-bg { background: linear-gradient(135deg, #111 60%, #1a1a1a); }
.demo2-bg { background: linear-gradient(135deg, #000 40%, #001a18); }
.demo3-bg { background: linear-gradient(135deg, #04040f 40%, #08082a); }
.card-body {
    padding: 18px 20px 20px;
    border-top: 1px solid #1e1e32;
}
.card-num {
    font-size: 10px;
    letter-spacing: 2px;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 6px;
}
.card-title {
    font-size: 18px;
    font-weight: 600;
}
.card-desc {
    margin-top: 6px;
    font-size: 12px;
    color: #555;
    line-height: 1.6;
}
.tag {
    display: inline-block;
    margin-top: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid;
}
.tag-white  { color: #888; border-color: #333; }
.tag-cyan   { color: #0ff; border-color: #0ff4; }
.tag-parade { color: #a8f; border-color: #a8f4; }
</style>
</head>
<body>
<header>
    <a href="/">← Home</a>
    <h1>WebGL 棒人間アニメーション</h1>
    <p class="subtitle">WebGL 2D Stick Figure Walking Demos</p>
</header>

<div class="grid">
    <a class="card" href="demo1.html">
        <div class="card-preview demo1-bg">🚶</div>
        <div class="card-body">
            <div class="card-num">Demo 01</div>
            <div class="card-title">Classic Walk</div>
            <div class="card-desc">白い棒人間がシンプルに歩く。厚みのある線とスムーズなウォークサイクル。</div>
            <span class="tag tag-white">White on Dark</span>
        </div>
    </a>

    <a class="card" href="demo2.html">
        <div class="card-preview demo2-bg">🏃</div>
        <div class="card-body">
            <div class="card-num">Demo 02</div>
            <div class="card-title">Neon Runner</div>
            <div class="card-desc">ネオンサイアン発光。ひざ・ひじ関節あり。加法混合によるグロー効果と残像トレイル。</div>
            <span class="tag tag-cyan">Neon Glow</span>
        </div>
    </a>

    <a class="card" href="demo3.html">
        <div class="card-preview demo3-bg">👫</div>
        <div class="card-body">
            <div class="card-num">Demo 03</div>
            <div class="card-title">Crowd Parade</div>
            <div class="card-desc">7色の棒人間がそれぞれ異なるサイズ・速度で行進。星空の夜景。</div>
            <span class="tag tag-parade">Colorful Crowd</span>
        </div>
    </a>
</div>
</body>
</html>

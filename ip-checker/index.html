<div class="max-w-2xl mx-auto px-4 py-10">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800">🌐 IP アドレス チェッカー</h1>
        <p class="text-slate-500 mt-2 text-sm">あなたのIPアドレス・画面サイズ・VPN状態をまとめて確認</p>
    </div>

    <!-- IP / Network Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
        <h2 class="text-base font-semibold text-slate-700 mb-4 flex items-center gap-2">
            <span>📡</span> IPアドレス / ネットワーク情報
        </h2>
        <div id="ip-section">
            <div class="animate-pulse space-y-3">
                <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                <div class="h-4 bg-slate-200 rounded w-2/3"></div>
                <div class="h-4 bg-slate-200 rounded w-3/5"></div>
            </div>
        </div>
    </div>

    <!-- VPN Detection Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
        <h2 class="text-base font-semibold text-slate-700 mb-4 flex items-center gap-2">
            <span>🔒</span> VPN / プロキシ 検出
        </h2>
        <div id="vpn-section">
            <div class="animate-pulse space-y-3">
                <div class="h-6 bg-slate-200 rounded-full w-40"></div>
                <div class="h-4 bg-slate-200 rounded w-3/4"></div>

            </div>
        </div>
    </div>

    <!-- Browser / Screen Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
        <h2 class="text-base font-semibold text-slate-700 mb-4 flex items-center gap-2">
            <span>💻</span> ブラウザ / 画面情報
        </h2>
        <div id="browser-section"></div>
    </div>

    <!-- WebRTC Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4">
        <h2 class="text-base font-semibold text-slate-700 mb-4 flex items-center gap-2">
            <span>🔎</span> WebRTC IPアドレス（ローカル）
        </h2>
        <div id="webrtc-section">
            <div class="animate-pulse">
                <div class="h-4 bg-slate-200 rounded w-1/2"></div>
            </div>
        </div>
        <p class="text-xs text-slate-400 mt-3">
            WebRTCにより検出されたIPアドレスです。VPNを使用していても、ブラウザの設定によってはローカルIPが漏洩することがあります。
        </p>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
        <a href="/" class="hover:underline">← ホームに戻る</a>
    </p>
</div>

<script>
// ── Helpers ────────────────────────────────────────────────────────────────

function flag(code) {
    if (!code || code.length !== 2) return '';
    return code.toUpperCase().replace(/./g, c =>
        String.fromCodePoint(c.charCodeAt(0) + 127397)
    );
}

function row(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return `
        <div class="flex flex-col sm:flex-row sm:items-start py-2 border-b border-slate-100 last:border-0 gap-0.5 sm:gap-3">
            <div class="text-xs font-medium text-slate-400 sm:w-36 shrink-0 pt-0.5">${label}</div>
            <div class="text-sm text-slate-800 break-all">${value}</div>
        </div>`;
}

function copyButton(text) {
    const escaped = text.replace(/'/g, "\\'");
    return `<button onclick="navigator.clipboard.writeText('${escaped}').then(()=>{ this.textContent='コピー済み'; setTimeout(()=>this.textContent='コピー',1500) })"
        class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 hover:bg-slate-200 text-slate-500 transition-colors align-middle">コピー</button>`;
}

function isPrivateIP(ip) {
    return /^(10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.|127\.|169\.254\.|fc|fd|fe80)/i.test(ip);
}

// ── Browser / Screen Info ──────────────────────────────────────────────────

function renderBrowserSection() {
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const items = [
        ['スクリーン解像度',   `${screen.width} × ${screen.height} px`],
        ['ビューポートサイズ', `${window.innerWidth} × ${window.innerHeight} px`],
        ['デバイスピクセル比', `${window.devicePixelRatio}x`],
        ['カラー深度',         `${screen.colorDepth} bit`],
        ['ブラウザ言語',       navigator.language],
        ['OS / プラットフォーム', navigator.platform || '不明'],
        ['CPUコア数',          navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} コア` : '不明'],
        ['デバイスメモリ',     navigator.deviceMemory ? `${navigator.deviceMemory} GB` : '不明'],
        ['通信種別',           conn ? (conn.effectiveType || conn.type || '不明') : '不明'],
        ['Cookie',             navigator.cookieEnabled ? '有効' : '無効'],
        ['User Agent',         `<span class="break-all">${navigator.userAgent}</span>`],
    ];
    document.getElementById('browser-section').innerHTML =
        items.map(([k, v]) => row(k, v)).join('');
}

// ── IP Info ────────────────────────────────────────────────────────────────

async function fetchIPInfo() {
    const section = document.getElementById('ip-section');
    try {
        const res = await fetch('https://ipapi.co/json/');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        if (d.error) throw new Error(d.reason || d.error);

        const ipDisplay = `<span class="font-mono font-bold text-slate-900">${d.ip}</span>${copyButton(d.ip)}`;

        section.innerHTML = [
            row('IPアドレス',   ipDisplay),
            row('国',           d.country_name ? `${flag(d.country_code)} ${d.country_name} (${d.country_code})` : ''),
            row('地域 / 都市',  [d.region, d.city].filter(Boolean).join(' / ')),
            row('タイムゾーン', d.timezone ? `${d.timezone} (UTC${d.utc_offset})` : ''),
            row('ISP / 組織',   d.org || ''),
            row('AS番号',       d.asn || ''),
        ].join('');

        return d;
    } catch (e) {
        section.innerHTML = `<p class="text-red-400 text-sm">IP情報の取得に失敗しました（${e.message}）。</p>`;
        return null;
    }
}

// ── VPN Detection ──────────────────────────────────────────────────────────

const VPN_NAMES = [
    'mullvad', 'nordvpn', 'nord vpn', 'expressvpn', 'express vpn',
    'protonvpn', 'proton vpn', 'private internet access', ' pia ',
    'ipvanish', 'surfshark', 'cyberghost', 'torguard', 'hidemyass', 'hma vpn',
    'windscribe', 'tunnelbear', 'ivpn', 'vyprvpn', 'airvpn', 'perfect privacy',
    'purevpn', 'strongvpn', 'hotspot shield', 'zenmate', 'hide.me', 'astrill',
    'atlasvpn', 'atlas vpn', 'privatevpn', 'vpn unlimited', 'vpnsecure',
    'cloudflare warp', 'warp vpn',
];

const DC_NAMES = [
    'amazon', 'aws ', 'google cloud', 'gcp', 'microsoft azure', 'azure ',
    'digitalocean', 'linode', 'akamai', 'vultr', 'ovh', 'hetzner', 'cloudflare',
    'fastly', 'm247', 'leaseweb', 'frantech', 'buyvm', 'choopa', 'as-choopa',
    'incapsula', 'staminus', 'serverius', 'datacamp limited', 'quadranet',
];

function renderVPNSection(ipData) {
    const section = document.getElementById('vpn-section');
    if (!ipData) {
        section.innerHTML = `<p class="text-slate-400 text-sm">IP情報が取得できないため、VPN検出は利用できません。</p>`;
        return;
    }

    const org  = (ipData.org || '').toLowerCase();
    const ipTZ = ipData.timezone || '';
    const brTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const checks = [];
    let score = 0;

    // 1. Timezone comparison
    if (ipTZ) {
        if (ipTZ !== brTZ) {
            score += 3;
            checks.push({ icon: '⚠️', sev: 'warn',
                label: 'タイムゾーン不一致',
                detail: `IPの位置: ${ipTZ}　ブラウザ: ${brTZ}` });
        } else {
            checks.push({ icon: '✅', sev: 'ok',
                label: 'タイムゾーン一致',
                detail: brTZ });
        }
    }

    // 2. Known VPN provider in org name
    const vpnHit = VPN_NAMES.find(v => org.includes(v));
    if (vpnHit) {
        score += 5;
        checks.push({ icon: '🚨', sev: 'danger',
            label: 'VPNプロバイダー検出',
            detail: `ISP/組織: "${ipData.org}"` });
    }

    // 3. Generic "vpn" / "proxy" keyword
    if (!vpnHit && (org.includes('vpn') || org.includes('proxy') || org.includes('anonymizer'))) {
        score += 4;
        checks.push({ icon: '🚨', sev: 'danger',
            label: 'VPN / プロキシ系キーワード検出',
            detail: `ISP/組織: "${ipData.org}"` });
    }

    // 4. Datacenter / hosting IP
    const dcHit = !vpnHit && DC_NAMES.some(d => org.includes(d));
    if (dcHit) {
        score += 2;
        checks.push({ icon: '⚠️', sev: 'warn',
            label: 'データセンター / クラウドIP',
            detail: `ISP/組織: "${ipData.org}" — VPN・企業回線の可能性` });
    }

    const badge = score >= 5
        ? 'bg-red-50 text-red-700 border-red-200'
        : score >= 2
            ? 'bg-yellow-50 text-yellow-700 border-yellow-200'
            : 'bg-green-50 text-green-700 border-green-200';

    const label = score >= 5 ? '🔴 VPN使用の可能性: 高'
        : score >= 2         ? '🟡 VPN使用の可能性: 中'
        :                      '🟢 VPN未検出';

    const sevColor = { ok: 'text-green-700', warn: 'text-yellow-700', danger: 'text-red-600' };

    const checksHTML = checks.map(c => `
        <div class="flex items-start gap-2 py-2 border-b border-slate-100 last:border-0">
            <span class="text-sm mt-0.5">${c.icon}</span>
            <div>
                <div class="text-sm font-medium ${sevColor[c.sev]}">${c.label}</div>
                <div class="text-xs text-slate-400 mt-0.5">${c.detail}</div>
            </div>
        </div>`).join('');

    section.innerHTML = `
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border text-sm font-bold mb-4 ${badge}">
            ${label}
        </div>
        <div>${checksHTML}</div>
        <p class="text-xs text-slate-400 mt-3">
            ※ ヒューリスティクスによる推定です。100%正確ではありません。
        </p>`;
}

// ── WebRTC Local IP ────────────────────────────────────────────────────────

async function detectWebRTCIPs() {
    const section = document.getElementById('webrtc-section');
    const ips = new Set();

    function render() {
        if (ips.size === 0) {
            section.innerHTML = `<p class="text-sm text-slate-400">WebRTC IPが検出されませんでした（ブラウザでブロック済みの可能性）。</p>`;
            return;
        }
        section.innerHTML = [...ips].map(ip => `
            <div class="flex items-center gap-2 py-1.5">
                <span class="w-2 h-2 rounded-full shrink-0 ${isPrivateIP(ip) ? 'bg-blue-400' : 'bg-orange-400'}"></span>
                <span class="font-mono text-sm text-slate-800">${ip}</span>
                <span class="text-xs text-slate-400">${isPrivateIP(ip) ? 'プライベート' : 'パブリック'}</span>
            </div>`).join('');
    }

    try {
        const pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
            ]
        });
        pc.createDataChannel('');
        await pc.createOffer().then(o => pc.setLocalDescription(o));

        await new Promise(resolve => {
            const done = () => { clearTimeout(timer); pc.close(); render(); resolve(); };
            const timer = setTimeout(done, 3000);
            pc.onicecandidate = e => {
                if (!e.candidate) { done(); return; }
                const ipv4 = /(\d{1,3}(?:\.\d{1,3}){3})/g;
                const ipv6 = /([0-9a-f]{1,4}(?::[0-9a-f]{0,4}){2,})/gi;
                let m;
                while ((m = ipv4.exec(e.candidate.candidate)) !== null) ips.add(m[1]);
                while ((m = ipv6.exec(e.candidate.candidate)) !== null) {
                    if (m[1].includes(':')) ips.add(m[1]);
                }
            };
        });
    } catch {
        section.innerHTML = `<p class="text-sm text-slate-400">WebRTCはこのブラウザでサポートされていません。</p>`;
    }
}

// ── Init ───────────────────────────────────────────────────────────────────

(async () => {
    renderBrowserSection();
    const [ipData] = await Promise.all([
        fetchIPInfo(),
        detectWebRTCIPs(),
    ]);
    renderVPNSection(ipData);
})();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Anchor Positioning デモ</title>
  <meta name="description" content="CSS Anchor Positioningで吹き出しを基準要素の上下左右に配置するデモ。">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="CSS Anchor Positioning デモ">
  <meta property="og:description" content="吹き出しを基準要素の上下左右へCSSだけで配置します。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://regepan.github.io/web-platform/anchor-positioning/demo/">
  <link rel="stylesheet" href="../../assets/demo.css">
  <link rel="stylesheet" href="./style.css">
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-KLDMTKJQ');</script>
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KLDMTKJQ" height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
  <main class="demo-shell">
    <h1 class="demo-heading">アンカー配置プレイグラウンド</h1>
    <p class="demo-intro">位置を選ぶと、吹き出しが基準ボタンの各辺へ移動します。</p>
    <p class="support-status" id="support-status" role="status">対応状況を確認しています…</p>
    <div class="position-controls" role="group" aria-label="吹き出しの位置">
      <button type="button" data-position="top" aria-pressed="false">上</button>
      <button type="button" data-position="right" aria-pressed="false">右</button>
      <button type="button" data-position="bottom" aria-pressed="true">下</button>
      <button type="button" data-position="left" aria-pressed="false">左</button>
    </div>
    <section class="anchor-stage" aria-label="アンカー配置の表示領域">
      <button class="anchor-target" type="button">基準ボタン</button>
      <div class="anchor-bubble position-bottom" id="anchor-bubble" role="status">anchor(bottom)</div>
    </section>
    <p class="standalone-note">CSS Anchor Positioning · anchor() demo</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>

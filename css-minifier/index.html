<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ブラウザ上でCSSをすばやく軽量化できる無料のCSS Minifier。入力したコードは外部に送信されません。">
    <title>CSS Minifier — CSS圧縮ツール</title>
    <style>
        :root {
            --ink: #17201d;
            --muted: #65716d;
            --line: #dce3df;
            --paper: #ffffff;
            --accent: #126b4e;
            --accent-dark: #0b513a;
            --accent-soft: #e4f3eb;
            --canvas: #f4f6f4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 7% 2%, rgba(152, 211, 178, .22), transparent 24rem),
                var(--canvas);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, textarea { font: inherit; }

        button { -webkit-tap-highlight-color: transparent; }

        .shell {
            width: min(1440px, 100%);
            margin: 0 auto;
            padding: 28px clamp(16px, 3vw, 44px) 36px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            font-size: 14px;
            font-weight: 750;
            letter-spacing: -.01em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 9px;
            color: white;
            background: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
        }

        .privacy {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .privacy::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #2e9f6b;
            box-shadow: 0 0 0 4px rgba(46, 159, 107, .1);
        }

        .intro {
            max-width: 770px;
            margin-bottom: 28px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(40px, 6.6vw, 76px);
            font-weight: 500;
            letter-spacing: -.055em;
            line-height: .96;
        }

        .lead {
            max-width: 610px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
        }

        .workspace {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--paper);
            box-shadow: 0 18px 50px rgba(24, 44, 35, .07);
        }

        .toolbar {
            display: flex;
            min-height: 66px;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-bottom: 1px solid var(--line);
        }

        .option {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #53605b;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .option input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .btn {
            min-height: 40px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: #4d5a55;
            background: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .15s;
        }

        .btn:hover { border-color: #bdc9c3; background: #f8faf8; }
        .btn:active { transform: translateY(1px); }

        .btn-primary {
            min-width: 118px;
            border-color: var(--accent);
            color: white;
            background: var(--accent);
        }

        .btn-primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }

        .editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .editor + .editor { border-left: 1px solid var(--line); }

        .editor-head {
            display: flex;
            min-height: 52px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 18px;
            border-bottom: 1px solid var(--line);
        }

        .editor-label {
            font-size: 13px;
            font-weight: 800;
        }

        .counter {
            color: #89938f;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 410px;
            padding: 20px;
            border: 0;
            border-radius: 0;
            outline: 0;
            resize: vertical;
            color: #28332f;
            background: white;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            line-height: 1.75;
            tab-size: 2;
        }

        textarea::placeholder { color: #a7b0ac; }
        textarea:focus { box-shadow: inset 0 0 0 2px rgba(18, 107, 78, .15); }
        #output { background: #fbfcfb; }

        .result-bar {
            display: flex;
            min-height: 66px;
            align-items: center;
            gap: 22px;
            padding: 13px 16px;
            border-top: 1px solid var(--line);
            background: #fbfcfb;
        }

        .metric {
            display: flex;
            align-items: baseline;
            gap: 7px;
            white-space: nowrap;
        }

        .metric strong {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px;
            font-weight: 500;
        }

        .metric span { color: var(--muted); font-size: 11px; }

        .saving {
            margin-left: auto;
            padding: 7px 11px;
            border-radius: 999px;
            color: var(--accent-dark);
            background: var(--accent-soft);
            font-size: 12px;
            font-weight: 800;
        }

        .copy-status {
            min-width: 90px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
        }

        .notes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 24px;
        }

        .note {
            padding: 4px 2px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.65;
        }

        .note strong {
            display: block;
            margin-bottom: 4px;
            color: #34413c;
            font-size: 12px;
        }

        @media (max-width: 760px) {
            .shell { padding-top: 20px; }
            .privacy { display: none; }
            .intro { margin-bottom: 22px; }
            .toolbar { align-items: flex-start; flex-wrap: wrap; }
            .actions { width: 100%; margin-left: 0; }
            .actions .btn { flex: 1; }
            .editors { grid-template-columns: 1fr; }
            .editor + .editor { border-top: 1px solid var(--line); border-left: 0; }
            textarea { min-height: 280px; }
            .result-bar { flex-wrap: wrap; gap: 12px 20px; }
            .saving { margin-left: 0; }
            .copy-status { width: 100%; }
            .notes { grid-template-columns: 1fr; gap: 4px; }
        }
    </style>
</head>
<body>
<main class="shell">
    <div class="topbar">
        <a class="brand" href="/" aria-label="ツール一覧へ戻る">
            <span class="brand-mark">{ }</span>
            <span>Web Utility Lab</span>
        </a>
        <span class="privacy">ブラウザ内で処理・外部送信なし</span>
    </div>

    <header class="intro">
        <p class="eyebrow">Developer tool · 01</p>
        <h1>CSS Minifier</h1>
        <p class="lead">余分な空白や改行、コメントを取り除いて、CSSをすっきり軽量化します。コードを貼り付けたら「圧縮する」を押すだけです。</p>
    </header>

    <section class="workspace" aria-label="CSS圧縮ツール">
        <div class="toolbar">
            <label class="option">
                <input id="preserveComments" type="checkbox" checked>
                /*! で始まるライセンスコメントを残す
            </label>
            <div class="actions">
                <button class="btn" id="sampleBtn" type="button">サンプル</button>
                <button class="btn" id="clearBtn" type="button">クリア</button>
                <button class="btn btn-primary" id="minifyBtn" type="button">圧縮する</button>
            </div>
        </div>

        <div class="editors">
            <div class="editor">
                <div class="editor-head">
                    <label class="editor-label" for="input">入力 CSS</label>
                    <span class="counter" id="inputCount">0 B</span>
                </div>
                <textarea id="input" spellcheck="false" autocomplete="off" placeholder="ここにCSSを貼り付けてください…"></textarea>
            </div>

            <div class="editor">
                <div class="editor-head">
                    <label class="editor-label" for="output">圧縮結果</label>
                    <span class="counter" id="outputCount">0 B</span>
                </div>
                <textarea id="output" readonly spellcheck="false" placeholder="圧縮したCSSがここに表示されます"></textarea>
            </div>
        </div>

        <div class="result-bar">
            <div class="metric"><strong id="beforeSize">0 B</strong><span>圧縮前</span></div>
            <div class="metric"><strong id="afterSize">0 B</strong><span>圧縮後</span></div>
            <span class="saving" id="saving">0% 削減</span>
            <span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span>
            <button class="btn" id="copyBtn" type="button" disabled>結果をコピー</button>
        </div>
    </section>

    <div class="notes">
        <p class="note"><strong>安全な圧縮</strong>文字列や data URL、calc() 内の演算子に必要な空白を保持します。</p>
        <p class="note"><strong>プライベート</strong>すべての処理はこのブラウザ内で完結し、入力したCSSは送信されません。</p>
        <p class="note"><strong>ショートカット</strong><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd> でもすぐに圧縮できます。</p>
    </div>
</main>

<script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const inputCount = document.getElementById('inputCount');
    const outputCount = document.getElementById('outputCount');
    const beforeSize = document.getElementById('beforeSize');
    const afterSize = document.getElementById('afterSize');
    const saving = document.getElementById('saving');
    const copyBtn = document.getElementById('copyBtn');
    const copyStatus = document.getElementById('copyStatus');

    const SAMPLE = `/* Card component */
.card {
    display: grid;
    gap: 1.5rem;
    max-width: 42rem;
    margin: 0 auto;
    padding: 2rem;
    color: #1f2937;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.card__title {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
}

@media (max-width: 640px) {
    .card { padding: 1.25rem; }
}`;

    function byteLength(value) {
        return new TextEncoder().encode(value).length;
    }

    function formatBytes(bytes) {
        if (bytes < 1000) return `${bytes} B`;
        return `${(bytes / 1000).toFixed(bytes < 10000 ? 1 : 0)} KB`;
    }

    function protectCss(css, preserveLicense) {
        const tokens = [];
        let clean = '';

        for (let i = 0; i < css.length;) {
            const char = css[i];

            if (char === '"' || char === "'") {
                const quote = char;
                let token = char;
                i++;
                while (i < css.length) {
                    token += css[i];
                    if (css[i] === '\\' && i + 1 < css.length) {
                        token += css[++i];
                    } else if (css[i] === quote) {
                        i++;
                        break;
                    }
                    i++;
                }
                clean += `___CSS_TOKEN_${tokens.push(token) - 1}___`;
                continue;
            }

            if (char === '/' && css[i + 1] === '*') {
                const end = css.indexOf('*/', i + 2);
                const stop = end === -1 ? css.length : end + 2;
                const comment = css.slice(i, stop);
                if (preserveLicense && comment.startsWith('/*!')) {
                    clean += `___CSS_TOKEN_${tokens.push(comment) - 1}___`;
                } else {
                    clean += ' ';
                }
                i = stop;
                continue;
            }

            clean += char;
            i++;
        }

        return { clean, tokens };
    }

    function minifyCss(css, preserveLicense) {
        if (!css.trim()) return '';

        const { clean, tokens } = protectCss(css, preserveLicense);
        let result = '';
        let pendingSpace = false;
        let parentheses = 0;

        for (let i = 0; i < clean.length; i++) {
            const char = clean[i];

            if (/\s/.test(char)) {
                pendingSpace = result.length > 0;
                continue;
            }

            const punctuation = '{};,>~';
            const plusCombinator = char === '+' && parentheses === 0;
            const trimBefore = punctuation.includes(char) || plusCombinator || char === ')';
            const previous = result[result.length - 1] || '';
            const trimAfterPrevious = '{}:;,>~('.includes(previous) || (previous === '+' && parentheses === 0);

            if (pendingSpace && !trimBefore && !trimAfterPrevious) result += ' ';
            pendingSpace = false;

            if (trimBefore && result.endsWith(' ')) result = result.slice(0, -1);
            result += char;

            if (char === '(') parentheses++;
            if (char === ')') parentheses = Math.max(0, parentheses - 1);
        }

        result = result
            .replace(/;}/g, '}')
            .replace(/!\s+important\b/gi, '!important')
            .trim();

        return result.replace(/___CSS_TOKEN_(\d+)___/g, (_, index) => tokens[Number(index)]);
    }

    function updateInputSize() {
        inputCount.textContent = formatBytes(byteLength(input.value));
        beforeSize.textContent = inputCount.textContent;
    }

    function minify() {
        const source = input.value;
        const result = minifyCss(source, document.getElementById('preserveComments').checked);
        const before = byteLength(source);
        const after = byteLength(result);
        const percent = before ? Math.max(0, (1 - after / before) * 100) : 0;

        output.value = result;
        inputCount.textContent = formatBytes(before);
        outputCount.textContent = formatBytes(after);
        beforeSize.textContent = formatBytes(before);
        afterSize.textContent = formatBytes(after);
        saving.textContent = `${percent.toFixed(percent >= 10 ? 0 : 1)}% 削減`;
        copyBtn.disabled = result.length === 0;
        copyStatus.textContent = result ? '圧縮しました' : '';
        window.setTimeout(() => { copyStatus.textContent = ''; }, 1500);
    }

    async function copyResult() {
        if (!output.value) return;
        try {
            await navigator.clipboard.writeText(output.value);
        } catch (error) {
            output.select();
            document.execCommand('copy');
        }
        copyStatus.textContent = 'コピーしました';
        window.setTimeout(() => { copyStatus.textContent = ''; }, 1600);
    }

    input.addEventListener('input', updateInputSize);
    document.getElementById('minifyBtn').addEventListener('click', minify);
    document.getElementById('copyBtn').addEventListener('click', copyResult);
    document.getElementById('sampleBtn').addEventListener('click', () => {
        input.value = SAMPLE;
        updateInputSize();
        minify();
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
        input.value = '';
        output.value = '';
        outputCount.textContent = '0 B';
        afterSize.textContent = '0 B';
        saving.textContent = '0% 削減';
        copyBtn.disabled = true;
        copyStatus.textContent = '';
        updateInputSize();
        input.focus();
    });
    document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
            event.preventDefault();
            minify();
        }
    });

    updateInputSize();
</script>
</body>
</html>

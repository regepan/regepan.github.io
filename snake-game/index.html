<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      color: #4ecca3;
      text-shadow: 0 0 20px #4ecca366;
    }

    #hud {
      display: flex;
      gap: 40px;
      font-size: 1rem;
      color: #aaa;
    }

    #hud span { color: #4ecca3; font-weight: bold; }

    canvas {
      border: 2px solid #4ecca344;
      box-shadow: 0 0 40px #4ecca322;
      background: #0f0f1a;
      display: block;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #overlay h2 {
      font-size: 1.8rem;
      color: #e94560;
      text-shadow: 0 0 20px #e9456066;
    }

    #overlay p { color: #888; font-size: 0.9rem; }

    button {
      padding: 10px 32px;
      background: transparent;
      border: 2px solid #4ecca3;
      color: #4ecca3;
      font-family: inherit;
      font-size: 1rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #4ecca3;
      color: #0f0f1a;
      box-shadow: 0 0 20px #4ecca366;
    }

    #controls {
      color: #555;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.8;
    }

    .wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile D-pad */
    #dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 4px;
      margin-top: 8px;
    }

    #dpad button {
      width: 52px;
      height: 52px;
      padding: 0;
      font-size: 1.2rem;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dpad-empty { visibility: hidden; }

    @media (max-width: 540px) {
      canvas { width: 320px; height: 320px; }
      #dpad { display: grid; }
    }

    @media (pointer: coarse) {
      #dpad { display: grid; }
    }
  </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KLDMTKJQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<h1>SNAKE</h1>

<div id="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
  <div>LEVEL: <span id="level">1</span></div>
</div>

<div class="wrapper">
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-msg">矢印キーまたはWASDで操作</p>
    <button id="start-btn">START</button>
  </div>
</div>

<div id="dpad">
  <div class="dpad-empty"></div>
  <button data-dir="UP">▲</button>
  <div class="dpad-empty"></div>
  <button data-dir="LEFT">◀</button>
  <div class="dpad-empty"></div>
  <button data-dir="RIGHT">▶</button>
  <div class="dpad-empty"></div>
  <button data-dir="DOWN">▼</button>
  <div class="dpad-empty"></div>
</div>

<div id="controls">
  ↑ ↓ ← →  /  W A S D &nbsp;|&nbsp; P: PAUSE
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');
const startBtn = document.getElementById('start-btn');

const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;

const COLORS = {
  head:  '#4ecca3',
  body:  '#2eaa83',
  food:  '#e94560',
  grid:  '#ffffff08',
  glow:  '#4ecca344',
};

let snake, dir, nextDir, food, score, level, speed, running, paused, animId, lastTime;
let best = parseInt(localStorage.getItem('snake_best') || '0');
bestEl.textContent = best;

function init() {
  snake = [
    { x: 10, y: 10 },
    { x:  9, y: 10 },
    { x:  8, y: 10 },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  level = 1;
  speed = 150;
  scoreEl.textContent = 0;
  levelEl.textContent = 1;
  placeFood();
}

function placeFood() {
  const empty = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!snake.some(s => s.x === c && s.y === r))
        empty.push({ x: c, y: r });
  food = empty[Math.floor(Math.random() * empty.length)];
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snake_best', best); }
    level = Math.floor(score / 5) + 1;
    levelEl.textContent = level;
    speed = Math.max(60, 150 - (level - 1) * 10);
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  running = false;
  cancelAnimationFrame(animId);
  overlayTitle.textContent = 'GAME OVER';
  overlayMsg.textContent = `SCORE: ${score}`;
  startBtn.textContent = 'RETRY';
  overlay.style.display = 'flex';
}

// ----- Drawing -----
function drawGrid() {
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
  }
}

function drawCell(x, y, color, glow) {
  const px = x * CELL, py = y * CELL, pad = 2;
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
  }
  ctx.fillStyle = color;
  ctx.fillRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2);
  ctx.shadowBlur = 0;
}

function drawFood(t) {
  const pulse = 0.7 + 0.3 * Math.sin(t / 300);
  const px = food.x * CELL + CELL / 2;
  const py = food.y * CELL + CELL / 2;
  const r = (CELL / 2 - 3) * pulse;
  ctx.shadowColor = COLORS.food;
  ctx.shadowBlur = 16;
  ctx.fillStyle = COLORS.food;
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function draw(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  snake.forEach((seg, i) => {
    drawCell(seg.x, seg.y, i === 0 ? COLORS.head : COLORS.body, i === 0);
  });

  drawFood(t);

  if (paused) {
    ctx.fillStyle = '#ffffff22';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }
}

// ----- Game loop -----
function loop(t) {
  if (!running) return;
  animId = requestAnimationFrame(loop);
  if (paused) { draw(t); return; }
  if (t - lastTime >= speed) {
    step();
    lastTime = t;
  }
  draw(t);
}

function startGame() {
  init();
  overlay.style.display = 'none';
  running = true;
  paused = false;
  lastTime = 0;
  animId = requestAnimationFrame(loop);
}

// ----- Input -----
const KEY_MAP = {
  ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
  w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
  W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT',
};

function applyDir(d) {
  const map = { UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0} };
  const nd = map[d];
  if (!nd) return;
  // Prevent reversing
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') { if (running) paused = !paused; return; }
  if (!running || paused) return;
  const d = KEY_MAP[e.key];
  if (d) { e.preventDefault(); applyDir(d); }
});

document.querySelectorAll('#dpad button[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => { if (running && !paused) applyDir(btn.dataset.dir); });
});

startBtn.addEventListener('click', startGame);

// Initial draw
draw(0);
</script>
</body>
</html>

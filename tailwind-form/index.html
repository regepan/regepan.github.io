<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Text Input Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<main class="mx-auto max-w-xl px-4 py-4 sm:px-6">

    <div class="rounded-2xl bg-white shadow-sm ring-1 ring-slate-200">

        <form id="demo-form" class="space-y-6 px-6 py-8 sm:px-8" novalidate>
            <div>
                <label for="text-input" class="mb-2 block text-sm font-medium">
                    テキスト <span class="text-red-600">*</span>
                </label>
                <input id="text-input" name="text" type="text" required placeholder="テキストを入力してください"
                       aria-describedby="text-error"
                       class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-base shadow-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 aria-[invalid=true]:border-red-500 aria-[invalid=true]:focus:ring-red-100">
                <p id="text-error" class="mt-1.5 hidden text-sm text-red-600">テキストを入力してください。</p>
            </div>

            
        </form>
    </div>
</main>

<script>
    const form = document.getElementById('demo-form');
    const textInput = document.getElementById('text-input');
    const textError = document.getElementById('text-error');
    const result = document.getElementById('result');

    function updateInputState() {
        const invalid = !textInput.validity.valid;
        textInput.setAttribute('aria-invalid', String(invalid));
        textError.classList.toggle('hidden', !invalid);
        return !invalid;
    }

    textInput.addEventListener('blur', updateInputState);
    textInput.addEventListener('input', () => {
        if (textInput.getAttribute('aria-invalid') === 'true') updateInputState();
    });

    form.addEventListener('submit', (event) => {
        event.preventDefault();

        if (!updateInputState()) {
            result.className = 'rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800';
            result.textContent = '入力内容を確認してください。';
            textInput.focus();
            return;
        }

        result.className = 'rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800';
        result.textContent = `「${textInput.value}」を受け付けました（デモのため実際には送信されません）。`;
    });

    form.addEventListener('reset', () => {
        window.setTimeout(() => {
            textInput.removeAttribute('aria-invalid');
            textError.classList.add('hidden');
            result.className = 'hidden rounded-xl border p-4 text-sm';
            result.textContent = '';
        });
    });
</script>
</body>
</html>
